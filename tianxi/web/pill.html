<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小天之光</title>
<style>
/* 小天之光: the always-on status pill at the top of the screen. */
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;user-select:none}
.pill{position:absolute;left:50%;top:6px;transform:translateX(-50%);height:34px;display:flex;align-items:center;gap:9px;padding:0 16px 0 8px;border-radius:17px;background:rgba(28,28,28,.94);border:1px solid #3a3a3a;color:#e8e8e8;font-size:13px;white-space:nowrap;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.35);transition:opacity .3s,width .3s;max-width:330px}
.pill.idle{padding:0 8px;opacity:.55}
.pill.idle span{display:none}
.pill:hover{opacity:1}
.pill span{overflow:hidden;text-overflow:ellipsis}
.orb{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb46b 0,#e2502e 30%,#5a2fd0 62%,#141432 85%);flex:none}
.busy .orb{animation:b 1.6s ease-in-out infinite}
@keyframes b{50%{filter:brightness(1.4);transform:scale(1.1)}}
.ask{border-color:#8a6420;background:rgba(48,36,16,.96);color:#ffd7a1}
.dec b{font-weight:700;color:#1d1300;background:#e3a23b;border-radius:9px;padding:0 6px;margin-left:2px}
</style>
</head>
<body>
<div class="pill idle" id="p"><i class="orb"></i><span id="t"></span></div>
<script>
const TOKEN = new URLSearchParams(location.search).get('t') || ''
const L = { calendar_add: '添加日程', calendar_update: '修改日程', calendar_list: '查看日程', todo_add: '添加待办', todo_list: '查看待办', mail_draft: '起草邮件', mail_send: '发送邮件', folder_list: '查看文件夹', file_move: '整理文件', brief_publish: '整理今天', memory_save: '记下来', show_ui: '生成界面', later_add: '记下稍后做', web_search: '搜索网页', web_fetch: '打开网页', read: '读文件', write: '写文件', edit: '改文件', bash: '运行命令' }
let st = { status: 'idle', approvals: [], brief: null, last: '' }
const p = document.getElementById('p'), t = document.getElementById('t')
const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') }
function render() {
  const open = st.brief && st.brief.date === today() ? (st.brief.items || []).filter((i) => i.kind === 'decide' && i.status !== 'resolved').length : 0
  p.className = 'pill'
  if (st.approvals.length) { p.classList.add('ask'); t.textContent = '需要你确认：' + (L[st.approvals[0].tool] || st.approvals[0].tool) }
  else if (st.status !== 'idle') { p.classList.add('busy'); t.textContent = st.last ? '小天在' + st.last : '小天在想' }
  else if (open) { p.classList.add('dec'); t.innerHTML = '今天有事等你定 <b>' + open + '</b>' }
  else { p.classList.add('idle'); t.textContent = '' }
}
async function load() {
  const s = await (await fetch('/api/state', { headers: { 'x-tianxi-token': TOKEN } })).json()
  st.status = s.status; st.approvals = s.approvals; st.brief = s.brief; render()
}
const es = new EventSource('/api/events?t=' + encodeURIComponent(TOKEN))
es.onmessage = (e) => {
  const m = JSON.parse(e.data)
  if (m.type === 'status') { st.status = m.status; if (m.status === 'idle') st.last = ''; render() }
  else if (m.type === 'item' && m.item.role === 'tool' && m.item.state === 'running') { st.last = L[m.item.name] || '做事'; render() }
  else if (m.type === 'hello' || m.type === 'approval' || m.type === 'approval-gone' || m.type === 'turn-end' || (m.type === 'store' && m.name === 'brief')) load()
}
p.onclick = () => window.tianxiApp && window.tianxiApp.show()
load()
</script>
</body>
</html>
