<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天禧AI</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="light.css">
<link rel="stylesheet" href="motion.css">
<script>try{var t=JSON.parse(localStorage.getItem('tx.theme')||'"dark"');if(t==='system')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="txorb" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#ffb46b"/><stop offset=".32" stop-color="#e2502e"/><stop offset=".68" stop-color="#5a2fd0"/><stop offset="1" stop-color="#1d1a4a"/></radialGradient></defs></svg>
<div class="app procon" id="app">
  <!-- left: the bot roster, grouped by tag like a messenger; you, your apps and updates sit at the bottom -->
  <nav class="rail" id="rail">
    <div class="rtop"><div class="drag"></div><button class="rb" id="bTheme" data-act="theme-flip" title="切换深色 / 浅色"><svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"/></svg></button><button class="rb" id="bSearch" title="搜索 (Ctrl K)"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg></button><button class="rb" data-act="agent-new" title="新建 Bot"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
    <label class="search" id="searchBox" hidden><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="搜索 Bot"><kbd>Esc</kbd></label>
    <div class="agents" id="agentList"></div>
    <div class="rfoot">
      <button class="mebtn" id="meBtn" data-act="menu" title="我的"><span class="uav" id="meAv">你</span><span class="n" id="nMe" hidden></span></button>
      <button class="connect" data-act="apps"><span>连接应用</span><span class="appic" id="appIc"></span></button>
      <button class="rb updb" id="bUpd" data-act="upd-menu" title="有新版本" hidden><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg></button>
    </div>
    <div class="umenu" id="umenu" hidden></div>
  </nav>

  <main class="main">
    <!-- chat with one bot -->
    <section class="view" id="vChat">
      <header class="chead">
        <button class="who" data-act="panel-toggle" title="Bot 详情"><span id="cAvatar"></span><b id="cName">天禧</b></button>
        <div class="pm" id="pmBadge" title="点击关闭临时模式">临时模式</div>
      </header>
      <div class="feed" id="feed"><div class="col" id="msgs"></div></div>
      <div class="composer">
        <div class="inner">
          <div id="chips" hidden></div>
          <div class="inbox" id="ring">
            <button class="plus" id="bPlus" title="更多"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <textarea id="inp" rows="1" placeholder="发消息"></textarea>
            <div class="mpicks" id="mpicks"></div>
            <button class="mic" id="bMic" title="语音输入"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"/></svg></button>
            <button class="send" id="send" aria-label="发送"><svg class="wave" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg><svg class="arrow" width="18" height="18" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div class="pickmenu" id="pickMenu" hidden></div>
            <div class="plusmenu" id="plusMenu" hidden>
              <button id="bPriv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 20L20 4"/></svg><span>临时模式</span><small>这段对话不记住</small></button>
              <button id="bUndo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>算了</span><small>撤回刚做的上一件事</small></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- your own space: brief, memory, reflection, records; and a bot's profile -->
    <section class="view page" id="vPage" hidden><div class="pg" id="pg"></div></section>
  </main>

  <!-- right: the bot itself — its details and routines, its library, its computer -->
  <aside class="proc" id="proc">
    <div class="ph"><div class="drag"></div><button class="rb" data-act="share" title="导出这段对话"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5"/><path d="M5 13v5.5a1.5 1.5 0 0 0 1.5 1.5h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg></button><button class="rb" data-act="proc-close" title="收起"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="vsep"></span></div>
    <div class="pb" id="procBody"></div>
  </aside>
</div>

<div class="modal" id="modal" hidden><div class="mbox" id="mbox"></div></div>

<div class="wctl" id="wctl" hidden>
  <button data-win="min" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
  <button data-win="max" title="最大化"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
  <button data-win="close" class="x" title="关闭到托盘"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
</div>

<div class="setup" id="setup"><div class="box">
  <h2><i class="orb"></i>先给天禧接一个大模型</h2>
  <p>没有 API Key 也能先免费用起来：借用你电脑上已登录的软件，或者注册一个智谱账号。有 Key 的话选“我有 API Key”。</p>
  <div class="fm-tabs" id="setupTabs"><button class="on" data-setup="free"><b>免费用起来</b>不用买 Key</button><button data-setup="key"><b>我有 API Key</b>DeepSeek、通义、Kimi 等</button></div>
  <div id="setupFree"></div>
  <div id="setupForm" hidden></div>
</div></div>

<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
<script src="voice.js"></script>
<script src="theme.js"></script>
</body>
</html>
