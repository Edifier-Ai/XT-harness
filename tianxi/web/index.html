<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>天禧AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><radialGradient id="txorb" cx="35%" cy="28%" r="80%"><stop offset="0" stop-color="#ffb46b"/><stop offset=".32" stop-color="#e2502e"/><stop offset=".68" stop-color="#5a2fd0"/><stop offset="1" stop-color="#1d1a4a"/></radialGradient></defs></svg>
<div class="app" id="app">
  <!-- left: the bot roster, like contacts in a messenger; your own space sits at the bottom -->
  <nav class="rail" id="rail">
    <div class="rtop"><div class="drag"></div><button class="ib" data-act="agent-new" title="新建 Bot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20h8"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button></div>
    <label class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg><input id="q" placeholder="搜索"><kbd>Ctrl K</kbd></label>
    <div class="agents" id="agentList"></div>
    <div class="rlinks">
      <button data-go="plugins"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 3v4M15 3v4M7 7h10v4a5 5 0 0 1-10 0z"/><path d="M12 16v5"/></svg>插件</button>
    </div>
    <div class="mine">
      <button class="mebtn" data-go="me" id="meBtn"><span class="uav" id="meAv">你</span><span class="tx"><b id="meName">我的</b><small id="meSub">记忆、简报和操作记录</small></span><span class="n" id="nMe" hidden></span></button>
      <button class="ib" data-go="settings" title="设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </nav>

  <main class="main">
    <!-- chat with one agent -->
    <section class="view" id="vChat">
      <header class="chead">
        <button class="who" data-act="agent-profile" title="Bot 设置"><span id="cAvatar"></span><span class="nm"><b id="cName">天禧</b><small id="cSub"></small></span></button>
        <div class="pm" id="pmBadge" title="点击关闭临时模式">临时模式</div>
        <div class="hacts">
          <button class="ib comp" id="bProc" data-act="proc-toggle" title="它的电脑"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="18" height="12.5" rx="2.5"/><path d="M8.5 20.5h7M12 17v3.5"/></svg></button>
          <button class="ib" data-act="agent-profile" title="Bot 设置"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
        </div>
      </header>
      <div class="feed" id="feed"><div class="col" id="msgs"></div></div>
      <div class="composer">
        <div class="inner">
          <div id="chips"></div>
          <div class="inbox" id="ring">
            <button class="plus" id="bPlus" title="更多"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></button>
            <textarea id="inp" rows="1" placeholder="发消息"></textarea>
            <button class="send" id="send" aria-label="发送"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4" stroke="currentColor" stroke-width="1.8" fill="none"/></svg></button>
            <div class="plusmenu" id="plusMenu" hidden>
              <button id="bPriv"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6z"/><path d="M4 20L20 4"/></svg><span>临时模式</span><small>这段对话不记住</small></button>
              <button id="bUndo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span>算了</span><small>撤回刚做的上一件事</small></button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- the personal spaces: brief, memory, reflection, records, settings, agent profile -->
    <section class="view page" id="vPage" hidden><div class="pg" id="pg"></div></section>
  </main>

  <!-- right: the bot's computer (what it is doing, step by step) and its routines -->
  <aside class="proc" id="proc">
    <div class="ph"><div class="ptabs" id="ptabs"><button data-act="ptab" data-t="computer" class="on">电脑</button><button data-act="ptab" data-t="routines">日常任务</button></div><button class="ib" data-act="proc-close" title="收起"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 3l10 10m0-10L3 13" stroke="currentColor" stroke-width="1.6"/></svg></button></div>
    <div class="pb" id="procBody"></div>
  </aside>
</div>

<div class="wctl" id="wctl" hidden>
  <button data-win="min" title="最小化"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 6h10" stroke="currentColor" stroke-width="1.2"/></svg></button>
  <button data-win="max" title="最大化"><svg width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.2"/></svg></button>
  <button data-win="close" class="x" title="关闭到托盘"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1.5 1.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.2"/></svg></button>
</div>

<div class="setup" id="setup"><div class="box">
  <h2><i class="orb"></i>先给天禧接一个大模型</h2>
  <p>天禧的“大脑”用第三方大模型 API。选一家，填上你自己的 API Key 就能用。Key 只加密保存在这台电脑上。</p>
  <div id="setupForm"></div>
</div></div>

<div class="toasts" id="toasts"></div>
<script src="app.js"></script>
</body>
</html>
