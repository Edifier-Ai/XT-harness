<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>天禧AI</title>
<style>
html,body{margin:0;height:100%;background:#212121;color:#ececec;font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;-webkit-app-region:drag}
.c{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.orb{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb46b 0,#e2502e 30%,#5a2fd0 62%,#141432 85%);animation:b 1.6s ease-in-out infinite}
@keyframes b{50%{filter:brightness(1.35);transform:scale(1.08)}}
#msg{font-size:14px;color:#a8a8a8}
</style>
</head>
<body><div class="c"><div class="orb"></div><div id="msg">天禧正在醒来…</div></div></body>
</html>
