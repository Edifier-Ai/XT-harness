<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>小天 Bot</title>
<!-- The App's first page, before a computer is paired or when the paired one cannot be reached. -->
<style>
:root{--bg:#000;--s1:#121214;--s2:#1b1b1e;--line:#232326;--tx:#f2f2f3;--tx2:#a3a3a8;--tx3:#6e6e74;--bad:#ea5b5b;--warn:#e6a54a;--ok:#46b98a;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.55 "Noto Sans SC","PingFang SC",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{min-height:100vh;display:flex;flex-direction:column;padding:28px 20px 24px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:36px 0 26px}
.orb{width:96px;height:96px;position:relative;animation:float 5s ease-in-out infinite}
.orb img{width:100%;height:100%;display:block}
@keyframes float{50%{transform:translateY(-6px)}}
h1{font-size:26px;margin:18px 0 6px;letter-spacing:.5px}
.sub{color:var(--tx2);font-size:15px;max-width:290px}
.err{background:rgba(234,91,91,.1);border:1px solid rgba(234,91,91,.28);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.err b{display:block;font-size:15px;margin-bottom:2px}
.err span{color:var(--tx2);font-size:14px}
.err .row{display:flex;gap:10px;margin-top:12px}
.card{background:var(--s1);border-radius:18px;overflow:hidden;margin-bottom:14px}
.lab{color:var(--tx3);font-size:13px;margin:6px 4px 8px}
.host{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:14px 16px;text-align:left}
.host+.host{border-top:1px solid var(--line)}
.host .ic{width:38px;height:38px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
.host .m{flex:1;min-width:0}
.host b{display:block;font-weight:600;font-size:16px}
.host small{display:block;color:var(--tx3);font-size:13px}
.host .x{border:0;background:none;color:var(--tx3);padding:6px;font-size:13px}
.btn{height:50px;border-radius:25px;border:0;background:var(--tx);color:#0b0b0c;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.sec{background:var(--s2);color:var(--tx);font-weight:500}
.btn.sm{height:38px;border-radius:19px;font-size:14px;width:auto;padding:0 16px}
.steps{padding:6px 16px}
.step{display:flex;gap:12px;padding:12px 0}
.step+.step{border-top:1px solid var(--line)}
.step i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--s2);color:var(--tx2);font-size:12px;display:grid;place-items:center;flex:none;margin-top:1px}
.step span{color:var(--tx2);font-size:14px}
.step b{color:var(--tx);font-weight:500}
.form{padding:16px}
.form label{display:block;color:var(--tx3);font-size:13px;margin:0 2px 6px}
.form input{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--s2);padding:0 14px;font-size:16px;outline:none;margin-bottom:12px}
.form input:focus{border-color:#4a4a52}
.form .note{color:var(--tx3);font-size:13px;margin:-2px 2px 14px}
.form .bad{color:var(--bad);font-size:13px;margin:-4px 2px 12px}
.acts{display:flex;flex-direction:column;gap:10px;margin:6px 0 18px}
.foot{margin-top:auto;text-align:center;color:var(--tx3);font-size:12px;padding-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="orb"><img src="orb.png" alt=""></div>
    <h1>小天 Bot</h1>
    <div class="sub">电脑上的 Bot 在干活，手机上和它聊、替它点确认，也能看着电脑屏幕、随时接手。</div>
  </div>

  <div class="err" id="err" hidden></div>

  <div id="hostsBox" hidden>
    <div class="lab">连过的电脑</div>
    <div class="card" id="hosts"></div>
  </div>

  <div class="acts" id="acts">
    <button class="btn" id="scan"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M7 12h10"/></svg>扫码连接电脑</button>
    <button class="btn sec" id="manualBtn">输入地址和配对码</button>
  </div>

  <div class="card" id="manual" hidden>
    <div class="form">
      <label for="addr">电脑地址</label>
      <input id="addr" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="192.168.1.8:3091">
      <label for="code">配对码</label>
      <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6 位数字">
      <div class="note">都在电脑上：小天 Bot › 设置 › 手机，二维码旁边。</div>
      <div class="bad" id="bad" hidden></div>
      <button class="btn" id="go">连接</button>
    </div>
  </div>

  <div class="lab">第一次用</div>
  <div class="card steps">
    <div class="step"><i>1</i><span>在电脑上打开 <b>小天 Bot › 设置 › 手机</b>，打开“允许手机连接”。手机和电脑连同一个 Wi-Fi。</span></div>
    <div class="step"><i>2</i><span>点 <b>扫码连接电脑</b>，扫电脑上的二维码。连上之后，打开 App 就直接进去。</span></div>
    <div class="step"><i>3</i><span>想在手机上看电脑屏幕、接手操作：装 <b>UU 远程</b>，手机和电脑登录同一个 UU 账号。</span></div>
  </div>

  <div class="foot" id="ver"></div>
</div>
<script>
'use strict'
const N = window.XiaotianNative
const $ = (s) => document.querySelector(s)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return !t ? '' : m < 2 ? '刚刚' : m < 60 ? m + ' 分钟前' : m < 1440 ? Math.round(m / 60) + ' 小时前' : Math.round(m / 1440) + ' 天前' }
const PC = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>'

function hosts() {
  let list = []
  try { list = JSON.parse(N ? N.hosts() : '[]') } catch {}
  $('#hostsBox').hidden = !list.length
  $('#hosts').innerHTML = list.slice().sort((a, b) => (b.at || 0) - (a.at || 0)).map((h) => `<div class="host" data-id="${esc(h.id)}" role="button"><span class="ic">${PC}</span><span class="m"><b>${esc(h.name)}</b><small>${esc(h.origin.replace(/^https?:\/\//, ''))}${h.at ? ' · ' + ago(h.at) : ''}</small></span><button class="x" data-forget="${esc(h.id)}">移除</button></div>`).join('')
  return list
}
// #err=<name>|<address>: the computer the App tried to open could not be reached
function err() {
  const m = /[#&]err=([^&]*)/.exec(location.hash)
  if (!m) return
  const [name, addr] = decodeURIComponent(m[1]).split('|')
  const cur = hosts().find((h) => h.current)
  $('#err').hidden = false
  $('#err').innerHTML = `<b>连不上${name ? ' ' + esc(name) : '这台电脑'}</b><span>${addr ? esc(addr) + ' · ' : ''}电脑开着吗？小天 Bot 打开了吗？手机和电脑要连同一个 Wi-Fi。电脑换了网络，就重新扫一次码。</span><div class="row">${cur ? `<button class="btn sm" id="retry">重试</button>` : ''}<button class="btn sm sec" id="rescan">重新扫码</button></div>`
  if (cur) $('#retry').onclick = () => N.switchHost(cur.id)
  $('#rescan').onclick = () => N && N.scan()
}
function showManual() {
  $('#manual').hidden = false; $('#manualBtn').hidden = true
  setTimeout(() => { $('#manual').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#addr').focus() }, 60)
}
window.showManual = showManual
// Back on this page: close the typed-address form first
window.mobBack = () => { if (!$('#manual').hidden) { $('#manual').hidden = true; $('#manualBtn').hidden = false; return true } return false }

$('#scan').onclick = () => N && N.scan()
$('#manualBtn').onclick = showManual
$('#hosts').onclick = (e) => {
  const f = e.target.closest('[data-forget]')
  if (f) { e.stopPropagation(); N.forgetHost(f.dataset.forget); hosts(); return }
  const h = e.target.closest('[data-id]')
  if (h) N.switchHost(h.dataset.id)
}
$('#go').onclick = () => {
  let a = $('#addr').value.trim().replace(/^https?:\/\//, '').replace(/\/.*$/, '')
  const c = $('#code').value.replace(/\D/g, '')
  const bad = (t) => { $('#bad').hidden = false; $('#bad').textContent = t }
  if (!/^[\w.-]+(:\d{1,5})?$/.test(a)) return bad('地址写成 192.168.1.8:3091 这样')
  if (!/:\d+$/.test(a)) a += ':3091'
  if (c.length !== 6) return bad('配对码是 6 位数字')
  $('#bad').hidden = true
  N && N.connect(`http://${a}/pair?c=${c}`)
}
$('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#go').click() })
$('#ver').textContent = N ? '小天 App ' + N.version() : ''
hosts(); err()
</script>
</body>
</html>
