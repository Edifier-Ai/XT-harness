# Builds the Mac app (Apple silicon and Intel) for each new version, starts it once as a check,
# and attaches the .dmg files to the version's GitHub Release (the same release as the Windows installer).
# Runs when release/manifest.json changes on main, or by hand from the Actions tab.
name: Mac app

on:
  push:
    branches: [main]
    paths: [release/manifest.json, .github/workflows/mac.yml, build/assemble-mac.sh, build/mac-check.mjs]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version
        id: v
        run: |
          VER=$(node -p "require('./release/manifest.json').version")
          # the last commit that changed anything inside the Mac app; a .dmg already built from it is not built again
          KEY=$(git log -1 --format=%h -- desktop tianxi build/assemble-mac.sh build/mac-check.mjs build/icon.icns build/runtime-lock .github/workflows/mac.yml release/manifest.json)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"; echo "key=$KEY" >> "$GITHUB_OUTPUT"
          L=$(gh release view "v$VER" --json assets --jq ".assets[] | select(.name==\"XiaotianBot-$VER-mac-${{ matrix.arch }}.dmg\") | .label" 2>/dev/null || true)
          echo "built: $L, now: $KEY"
          if [ -n "$L" ] && [[ "$L" == *"$KEY"* ]]; then echo "exists=1" >> "$GITHUB_OUTPUT"; echo "already built from $KEY"; fi

      - uses: actions/setup-node@v4
        if: steps.v.outputs.exists != '1'
        with:
          node-version: 22

      - name: Electron and DSH runtime
        if: steps.v.outputs.exists != '1'
        run: |
          mkdir -p build/dl build/runtime-mac
          curl -sSfL -o build/dl/electron-mac-${{ matrix.arch }}.zip https://github.com/electron/electron/releases/download/v44.7.0/electron-v44.7.0-darwin-${{ matrix.arch }}.zip
          # the same DSH version as Windows; the lock file there only lists Windows' native packages, so resolve fresh for this Mac
          cp build/runtime-lock/package.json build/runtime-mac/
          (cd build/runtime-mac && npm install --no-audit --no-fund --no-package-lock)

      - name: Assemble app and disk image
        if: steps.v.outputs.exists != '1'
        run: bash build/assemble-mac.sh ${{ steps.v.outputs.ver }} ${{ matrix.arch }}

      - name: Install from the disk image and start once
        if: steps.v.outputs.exists != '1'
        run: |
          VER=${{ steps.v.outputs.ver }}; A=${{ matrix.arch }}
          # install the way a person would: open the .dmg, copy the app out
          hdiutil attach "build/out-mac/XiaotianBot-$VER-mac-$A.dmg" -nobrowse -readonly -mountpoint /tmp/xtdmg
          ls -la /tmp/xtdmg
          mkdir -p "$HOME/Applications"; ditto "/tmp/xtdmg/小天 Bot.app" "$HOME/Applications/小天 Bot.app"
          hdiutil detach /tmp/xtdmg
          codesign --verify --deep --strict "$HOME/Applications/小天 Bot.app" && echo "signature ok"
          # a dummy model so the runtime starts and the home page shows (no model call is made)
          U="$HOME/Library/Application Support/TianxiAI-Concept"; mkdir -p "$U"
          printf '{"provider":"deepseek","baseURL":"https://api.deepseek.com/v1","model":"deepseek-chat","key":"%s","keyEnc":false}' "$(printf test | base64)" > "$U/config.json"
          set +e
          node build/mac-check.mjs "$HOME/Applications/小天 Bot.app" "check-$A"; rc=$?
          echo "--- app.log"; tail -40 "check-$A/app.log"
          echo "--- runtime.log"; tail -40 "$U/logs/runtime.log"; cp "$U/logs/runtime.log" "check-$A/" 2>/dev/null
          # errors 小天 showed in chats (the dummy key makes any model call fail with 401; anything else is a real problem)
          grep -rhoE '"role":"error"[^}]{0,400}' "$U" 2>/dev/null | sort | uniq -c | tee "check-$A/errors.txt"
          exit $rc

      # what the check saw (screenshots + check.json), on a branch of its own so it can be looked at without downloads
      - name: Keep the check's screenshots
        if: always() && steps.v.outputs.exists != '1'
        run: |
          A=${{ matrix.arch }}; [ -d "check-$A" ] || exit 0
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            rm -rf /tmp/cc && git clone -q --depth 1 --branch ci-checks "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/cc 2>/dev/null || { rm -rf /tmp/cc; mkdir /tmp/cc; git -C /tmp/cc init -q -b ci-checks; git -C /tmp/cc remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"; }
            rm -rf "/tmp/cc/mac-$A"; mkdir -p "/tmp/cc/mac-$A"; cp "check-$A"/* "/tmp/cc/mac-$A/"
            (cd /tmp/cc && git add -A && git commit -qm "mac-$A check for ${GITHUB_SHA::7}" && git push -q origin HEAD:ci-checks) && break
            sleep 5
          done

      - name: Publish
        if: steps.v.outputs.exists != '1'
        run: |
          VER=${{ steps.v.outputs.ver }}
          node build/release-notes.mjs
          gh release view "v$VER" >/dev/null 2>&1 || gh release create "v$VER" --target "$GITHUB_SHA" --title "小天 Bot $VER" --notes-file notes.md || true
          gh release edit "v$VER" --notes-file notes.md
          # the label (ASCII only: GitHub refuses some Unicode there) says which commit the file was built from
          A=${{ matrix.arch }}
          gh release upload "v$VER" "build/out-mac/XiaotianBot-$VER-mac-$A.dmg#Mac $A (build ${{ steps.v.outputs.key }})" --clobber
